# Reverse proxy Socket.IO -> container Node.js (service name "nodejs" port 8085).
# Menangani dua jenis request:
#   1. Upgrade WebSocket  -> ws://nodejs:8085 (via mod_proxy_wstunnel)
#   2. HTTP polling & GET /socket.io/socket.io.js -> http://nodejs:8085 (via mod_proxy_http)

<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*)$ ws://nodejs:8085/socket.io/$1 [P,L]
</IfModule>

ProxyPreserveHost On
ProxyPass        /socket.io/ http://nodejs:8085/socket.io/
ProxyPassReverse /socket.io/ http://nodejs:8085/socket.io/
